<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">Bytes per page builder edit, before and after set-scoped updates</title>
<desc id="d">A dumbbell chart of four pages on three Statamic sites. Changing one field of one block cost 20 to 57 KB per edit when the whole field was fetched and sent back, and 3 to 7 KB when one set is fetched and merged by id: 6 to 11 times less.</desc>
<rect x="0.5" y="0.5" width="759" height="415" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
<text x="32" y="46" font-size="17" font-weight="600" fill="#0b0b0b">Bytes per page builder edit</text>
<text x="32" y="68" font-size="13" fill="#52514e">Changing one field of one block, measured over HTTP on four pages of three Statamic sites</text>
<circle cx="38" cy="102" r="5" fill="#86b6ef"/>
<text x="50" y="106" font-size="12.5" fill="#52514e">Before: the whole field, fetched and sent back</text>
<circle cx="358" cy="102" r="5" fill="#1c5cab"/>
<text x="370" y="106" font-size="12.5" fill="#52514e">After: one set, fetched and merged by id</text>
<line x1="236.0" y1="122" x2="236.0" y2="344" stroke="#c3c2b7" stroke-width="1"/>
<text x="236.0" y="362" font-size="11.5" fill="#898781" text-anchor="start">0</text>
<line x1="361.3" y1="122" x2="361.3" y2="344" stroke="#e1e0d9" stroke-width="1"/>
<text x="361.3" y="362" font-size="11.5" fill="#898781" text-anchor="middle">20 KB</text>
<line x1="486.7" y1="122" x2="486.7" y2="344" stroke="#e1e0d9" stroke-width="1"/>
<text x="486.7" y="362" font-size="11.5" fill="#898781" text-anchor="middle">40 KB</text>
<line x1="612.0" y1="122" x2="612.0" y2="344" stroke="#e1e0d9" stroke-width="1"/>
<text x="612.0" y="362" font-size="11.5" fill="#898781" text-anchor="middle">60 KB</text>
<text x="32" y="144" font-size="13.5" fill="#0b0b0b">Service page</text>
<text x="32" y="161" font-size="11.5" fill="#898781">16 blocks</text>
<line x1="281.3" y1="150" x2="591.6" y2="150" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="591.6" cy="150" r="6" fill="#86b6ef" stroke="#ffffff" stroke-width="2"/>
<circle cx="281.3" cy="150" r="6" fill="#1c5cab" stroke="#ffffff" stroke-width="2"/>
<text x="728" y="146" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">7.9× less</text>
<text x="728" y="163" font-size="11.5" fill="#898781" text-anchor="end">56.7 → 7.2 KB</text>
<text x="32" y="202" font-size="13.5" fill="#0b0b0b">Leasing page</text>
<text x="32" y="219" font-size="11.5" fill="#898781">8 blocks</text>
<line x1="257.6" y1="208" x2="475.2" y2="208" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="475.2" cy="208" r="6" fill="#86b6ef" stroke="#ffffff" stroke-width="2"/>
<circle cx="257.6" cy="208" r="6" fill="#1c5cab" stroke="#ffffff" stroke-width="2"/>
<text x="728" y="204" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">11.1× less</text>
<text x="728" y="221" font-size="11.5" fill="#898781" text-anchor="end">38.2 → 3.4 KB</text>
<text x="32" y="260" font-size="13.5" fill="#0b0b0b">Company page</text>
<text x="32" y="277" font-size="11.5" fill="#898781">16 blocks</text>
<line x1="274.3" y1="266" x2="462.2" y2="266" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="462.2" cy="266" r="6" fill="#86b6ef" stroke="#ffffff" stroke-width="2"/>
<circle cx="274.3" cy="266" r="6" fill="#1c5cab" stroke="#ffffff" stroke-width="2"/>
<text x="728" y="262" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">5.9× less</text>
<text x="728" y="279" font-size="11.5" fill="#898781" text-anchor="end">36.1 → 6.1 KB</text>
<text x="32" y="318" font-size="13.5" fill="#0b0b0b">Homepage</text>
<text x="32" y="335" font-size="11.5" fill="#898781">15 blocks</text>
<line x1="256.3" y1="324" x2="362.4" y2="324" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<circle cx="362.4" cy="324" r="6" fill="#86b6ef" stroke="#ffffff" stroke-width="2"/>
<circle cx="256.3" cy="324" r="6" fill="#1c5cab" stroke="#ffffff" stroke-width="2"/>
<text x="728" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">6.2× less</text>
<text x="728" y="337" font-size="11.5" fill="#898781" text-anchor="end">20.2 → 3.2 KB</text>
<text x="32" y="392" font-size="11.5" fill="#898781">One edit is a read, a write, and the response. Tokens follow bytes, at roughly 3 to 4 bytes per token of JSON.</text>
</svg>
